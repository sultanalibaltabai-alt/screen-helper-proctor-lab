name: Build portable Windows release
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: python -m pip install -r requirements-build.txt
      - name: Test and build
        shell: pwsh
        run: ./Build-Release.ps1
      - name: Verify distribution
        run: python scripts/verify_release.py
      - uses: actions/upload-artifact@v4
        with:
          name: StudyTools-Windows-x64
          path: |
            release/*.zip
            release/SHA256SUMS.txt
          if-no-files-found: error
